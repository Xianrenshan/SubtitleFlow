<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>199 视频处理中枢</title>
<!-- Element Plus 基础样式 -->
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
<!-- 自定义样式 -->
<link rel="stylesheet" href="./css/style.css">
<base target="_blank">
</head>
<body>
<div id="app">
<div class="app-header">
<h1>199 视频处理中枢</h1>
<p>AI 驱动的字幕生成 · 翻译 · 压制一站式流水线</p>
</div>
<el-tabs v-model="activeTab" type="border-card">
<!-- ==================== 主流程 ==================== -->
<el-tab-pane label="处理中心" name="main">
  <!-- 动态组件：会自动去 templates/upload-tab.html 异步加载 -->
  <upload-tab></upload-tab>
</el-tab-pane>
<!-- ==================== 历史记录 ==================== -->
<el-tab-pane label="任务历史" name="history">
  <!-- 动态组件：会自动去 templates/history-tab.html 异步加载 -->
  <history-tab></history-tab>
</el-tab-pane>
<!-- ==================== 配置 ==================== -->
<el-tab-pane label="系统配置" name="config">
  <!-- 动态组件：会自动去 templates/config-tab.html 异步加载 -->
  <config-tab></config-tab>
</el-tab-pane>
</el-tabs>

<!-- 动态弹窗组件：会自动去 templates/crop-dialog.html 异步加载 -->
<crop-dialog></crop-dialog>
</div>
<!-- vue 与 element-plus -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus"></script>
<!-- 模块化前端 JS 入口 -->
<script type="module" src="./js/app.js"></script>
</body>
</html>
